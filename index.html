<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14357f">
<title>جدول عيادات أكتوبر 2026 — مستشفى دار صحة المرأة والطفل بالسويس</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0f2a66; --blue:#1d46b4; --sky:#2ba3c8; --mist:#eef3fb; --line:#dbe4f3;
  --ink:#16213d; --muted:#5b6785; --paper:#ffffff; --coral:#e2566f; --coral-bg:#fdecef;
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:'Cairo','Segoe UI',Tahoma,Arial,sans-serif;background:var(--mist);color:var(--ink);line-height:1.7;font-size:16px}
button,input{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}

/* hero */
.hero{position:relative;height:300px;overflow:hidden;background:var(--navy)}
.hero img{width:100%;height:100%;object-fit:cover;object-position:center 30%;display:block}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,30,80,.15) 0%,rgba(10,30,80,.35) 40%,rgba(10,30,80,.92) 100%)}
.hero-text{position:absolute;z-index:2;inset-inline:0;bottom:0;padding:0 20px 22px;max-width:880px;margin:0 auto;color:#fff}
.hero-org{font-size:13px;font-weight:600;opacity:.9}
.hero h1{font-size:26px;font-weight:800;line-height:1.35;margin:2px 0 6px}
.hero-sub{display:inline-block;background:rgba(255,255,255,.16);backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.3);padding:3px 14px;border-radius:99px;font-weight:700;font-size:15px}

/* controls */
.bar{position:sticky;top:0;z-index:20;background:rgba(238,243,251,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.wrap{max-width:880px;margin:0 auto;padding:0 14px}
.shifts{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 0 8px}
.shift{display:flex;align-items:center;justify-content:center;gap:8px;padding:9px 6px;border-radius:12px;background:var(--paper);border:1.5px solid var(--line);font-weight:700;color:var(--muted);transition:.15s}
.shift svg{width:20px;height:20px}
.shift[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.modes{display:flex;gap:4px;padding-bottom:8px}
.mode{flex:1;padding:6px 4px;font-weight:600;font-size:14.5px;color:var(--muted);border-bottom:3px solid transparent}
.mode[aria-pressed=true]{color:var(--blue);border-bottom-color:var(--blue)}

/* date strip */
.strip{display:flex;gap:6px;overflow-x:auto;padding:4px 14px 12px;scroll-snap-type:x proximity;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-width:58px;scroll-snap-align:center;padding:6px 8px;border-radius:12px;background:var(--paper);border:1.5px solid var(--line);text-align:center;line-height:1.25;position:relative}
.chip small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.chip b{font-size:19px;font-weight:800;color:var(--navy)}
.chip.past{opacity:.55}
.chip.today::after{content:"";position:absolute;top:5px;inset-inline-start:5px;width:7px;height:7px;border-radius:50%;background:var(--coral)}
.chip[aria-pressed=true]{background:var(--navy);border-color:var(--navy);opacity:1}
.chip[aria-pressed=true] small{color:#bcd0f5}
.chip[aria-pressed=true] b{color:#fff}
.specs{display:flex;gap:6px;overflow-x:auto;padding:4px 14px 12px;scrollbar-width:none}
.specs::-webkit-scrollbar{display:none}
.spec{flex:0 0 auto;padding:6px 14px;border-radius:99px;background:var(--paper);border:1.5px solid var(--line);font-weight:600;font-size:14.5px;white-space:nowrap}
.spec[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.searchbox{padding:2px 0 12px;position:relative}
.searchbox input{width:100%;padding:11px 44px 11px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper)}
.searchbox svg{position:absolute;inset-inline-start:auto;right:14px;top:13px;width:20px;height:20px;color:var(--muted);pointer-events:none}

/* content */
main{max-width:880px;margin:0 auto;padding:16px 14px 8px}
.dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:2px 2px 10px}
.dayhead h2{font-size:21px;font-weight:800;color:var(--navy)}
.tag{display:inline-block;background:var(--coral-bg);color:var(--coral);font-size:12.5px;font-weight:700;padding:0 10px;border-radius:99px;margin-inline-start:8px;vertical-align:middle}
.count{font-size:14px;color:var(--muted);font-weight:600}
.panel{background:var(--paper);border-radius:var(--radius);border:1px solid var(--line);overflow:hidden}
.row{display:grid;grid-template-columns:minmax(110px,34%) 1fr;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:start}
.row:last-child{border-bottom:0}
.row .sp{font-weight:800;color:var(--blue);line-height:1.45;padding-inline-start:10px;border-inline-start:4px solid var(--sky)}
.row .dr div{font-weight:600}
.row .dr div + div{margin-top:2px}
.empty{padding:34px 16px;text-align:center;color:var(--muted)}
.drow{grid-template-columns:64px 1fr;align-items:center}
.drow .dt{text-align:center;line-height:1.2;background:var(--mist);border-radius:10px;padding:6px 0}
.drow .dt b{display:block;font-size:22px;font-weight:800;color:var(--navy)}
.drow .dt small{font-size:12px;color:var(--muted);font-weight:700}
.drow.today .dt{background:var(--coral);}
.drow.today .dt b,.drow.today .dt small{color:#fff}
.drow.past{opacity:.5}
.res{padding:14px 16px;border-bottom:1px solid var(--line)}
.res:last-child{border-bottom:0}
.res h3{font-size:17px;font-weight:800;color:var(--navy)}
.res .line{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.res .lab{font-weight:700;font-size:14px;color:var(--blue);margin-inline-end:4px}
.res .lab em{font-style:normal;color:var(--muted);font-weight:600}
.d{background:var(--mist);border-radius:8px;padding:0 9px;font-size:13.5px;font-weight:600}
.d.today{background:var(--coral);color:#fff}
.note{margin:16px 2px 0;padding:12px 14px;border-radius:12px;background:#fff8e6;border:1px solid #f3e0a6;color:#6b5314;font-size:14px;font-weight:600}
footer{margin-top:22px;background:var(--navy);color:#cfdcf8;padding:22px 16px calc(22px + env(safe-area-inset-bottom,0px));text-align:center;font-size:14.5px}
footer b{color:#fff;font-size:16px}
footer a{color:#fff;font-weight:700;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.4)}
footer .hot{display:inline-block;margin-top:8px;background:var(--sky);color:#06284a;padding:6px 20px;border-radius:99px;font-weight:800;font-size:17px;border:0}

@media(min-width:720px){
  .hero{height:380px}.hero h1{font-size:36px}.hero-org{font-size:15px}
  .row{padding:14px 22px}.chip{min-width:64px}
}
@media print{
  .bar,.hero img,.hero::after{display:none}.hero{height:auto;background:none;color:#000}.hero-text{position:static;color:#000}
  .hero-sub{border-color:#000;background:none}.panel{border-color:#999}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

  document.querySelectorAll('.mode').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===st.mode));
  const S=DATA[st.shift];
  if(st.mode==='day'){
    if(!S.days.some(x=>x.d===st.date)) st.date=pickDate();
    ctl.innerHTML='<div class="wrap" style="padding:0"><div class="strip" id="strip">'+S.days.map(x=>
      `<button class="chip${x.d<TODAY?' past':''}${x.d===TODAY?' today':''}" data-date="${x.d}" aria-pressed="${x.d===st.date}"><small>${x.w}</small><b>${dnum(x.d)}</b></button>`).join('')+'</div></div>';
    const day=S.days.find(x=>x.d===st.date);
    const n=day.e.reduce((a,[,d])=>a+d.length,0);
    out.innerHTML=`<div class="dayhead"><h2>${day.w} ${dfull(day.d)}${day.d===TODAY?'<span class="tag">اليوم</span>':''}</h2><span class="count">${day.e.length} عيادة · ${n} طبيب</span></div>`+
      (day.e.length?`<div class="panel">`+day.e.map(([sp,docs])=>`<div class="row"><div class="sp">${sp}</div><div class="dr">${docs.map(x=>`<div>${x}</div>`).join('')}</div></div>`).join('')+`</div>`:`<div class="panel"><div class="empty">لا توجد عيادات في هذا اليوم.</div></div>`);
    const a=ctl.querySelector('.chip[aria-pressed=true]'); if(a) a.scrollIntoView({inline:'center',block:'nearest'});
  }
  else if(st.mode==='spec'){
    const list=specList();
    if(!list.includes(st.spec)) st.spec=list[0];
    ctl.innerHTML='<div class="wrap" style="padding:0"><div class="specs">'+list.map(n=>`<button class="spec" data-spec="${n}" aria-pressed="${n===st.spec}">${n}</button>`).join('')+'</div></div>';
    const rows=S.days.map(d=>{const f=d.e.find(([n])=>n===st.spec);return f?{d:d.d,w:d.w,docs:f[1]}:null}).filter(Boolean);
    out.innerHTML=`<div class="dayhead"><h2>${st.spec}</h2><span class="count">${S.days.length?SHIFT_NAME[st.shift]:''} · ${rows.length} يوم في الشهر</span></div><div class="panel">`+
      rows.map(r=>`<div class="row drow${r.d===TODAY?' today':''}${r.d<TODAY?' past':''}"><div class="dt"><b>${dnum(r.d)}</b><small>${r.w}</small></div><div class="dr">${r.docs.map(x=>`<div>${x}</div>`).join('')}</div></div>`).join('')+`</div>`;
    const a=ctl.querySelector('.spec[aria-pressed=true]'); if(a) a.scrollIntoView({inline:'center',block:'nearest'});
  }
  else{
    if(!document.getElementById('q')){
      ctl.innerHTML=`<div class="wrap"><div class="searchbox"><input id="q" type="search" placeholder="اكتب اسم الدكتور…" autocomplete="off" value="${st.q}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></div></div>`;
    }
    renderSearch();
  }
}

function renderSearch(){
  const q=norm(st.q);
  if(q.length<2){out.innerHTML='<div class="panel"><div class="empty">اكتب حرفين على الأقل من اسم الدكتور لعرض مواعيده في الفترتين.</div></div>';return}
  const map=new Map();
  for(const sh of ['morning','evening']){
    DATA[sh].days.forEach(d=>d.e.forEach(([sp,docs])=>docs.forEach(doc=>{
      if(!norm(doc).includes(q)) return;
      if(!map.has(doc)) map.set(doc,new Map());
      const k=sh+'|'+sp; const m=map.get(doc);
      if(!m.has(k)) m.set(k,{sh,sp,days:[]});
      m.get(k).days.push({d:d.d,w:d.w});
    })));
  }
  if(!map.size){out.innerHTML='<div class="panel"><div class="empty">لا توجد نتائج مطابقة. جرّب جزءًا آخر من الاسم.</div></div>';return}
  out.innerHTML='<div class="panel">'+[...map.entries()].sort((a,b)=>a[0].localeCompare(b[0],'ar')).map(([doc,m])=>
    `<div class="res"><h3>${doc}</h3>`+[...m.values()].sort((a,b)=>a.sh<b.sh?1:-1).map(g=>
      `<div class="line"><span class="lab">${g.sp} <em>(${g.sh==='morning'?'صباحًا':'مساءً'})</em></span>`+g.days.map(x=>`<span class="d${x.d===TODAY?' today':''}">${x.w} ${dnum(x.d)}</span>`).join('')+`</div>`).join('')+`</div>`).join('')+'</div>';
}

document.addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t) return;
  if(t.dataset.shift){st.shift=t.dataset.shift;st.date=null;render()}
  else if(t.dataset.mode){st.mode=t.dataset.mode;ctl.innerHTML='';render();if(st.mode==='search')setTimeout(()=>document.getElementById('q')?.focus(),50)}
  else if(t.dataset.date){st.date=t.dataset.date;render()}
  else if(t.dataset.spec){st.spec=t.dataset.spec;render()}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){st.q=e.target.value;renderSearch()}});

render();
</script>
</body>
</html>
